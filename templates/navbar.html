{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand fw-bold" href="{% url 'services:home' %}">
      <img src="{% static 'images/logo.png' %}" alt="Site Logo" height="40">
      DreamScape
    </a>

    <!-- Toggler for mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar links -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'services:home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'services:about' %}">About</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'services:service' %}">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'services:contact' %}">Contact</a></li>
      </ul>

      <!-- Right side links -->
      {% comment %}
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            {% if request.user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            </li>
            {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'signup' %}">Sign Up</a></li>
            {% endif %}
        </ul>
        {% endcomment %}
    </div>
  </div>
</nav>
